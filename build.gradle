plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.143' }

group = 'com.syaru.mecrosscable'
version = '0.1.0-alpha.1'
base { archivesName = 'me-cross-cable-neoforge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories {
    mavenCentral()
    maven { url = 'https://modmaven.dev' }
}
sourceSets {
    assetGenerator {
        java.srcDirs = ['tools', 'src/main/java']
        java.include '**/GenerateAssets.java', '**/CableGeometry.java', '**/ChannelDisplay.java'
    }
}
neoForge {
    version = '21.1.247'
    runs {
        client {
            client()
            gameDirectory = file('run')
            jvmArgument '-Xmx2G'
        }
        server { server(); gameDirectory = file('build/server-smoke'); programArgument '--nogui' }
    }
    mods {
        me_cross_cable { sourceSet sourceSets.main }
    }
}
dependencies {
    assetGeneratorImplementation 'com.google.code.gson:gson:2.10.1'
    implementation('org.appliedenergistics:appliedenergistics2:19.2.18') { transitive = false }
    runtimeOnly('org.appliedenergistics:guideme:21.1.17') { transitive = false }
}
tasks.register('generateAssets', JavaExec) {
    dependsOn tasks.named('assetGeneratorClasses')
    classpath = sourceSets.assetGenerator.runtimeClasspath
    mainClass = 'com.syaru.mecrosscable.tools.GenerateAssets'
    args layout.projectDirectory.dir('src/main/resources').asFile.absolutePath
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('jar') {
    from 'LICENSE'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('sourcesJar') { from 'tools' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
if (file('local/qa.gradle').isFile()) apply from: 'local/qa.gradle'
