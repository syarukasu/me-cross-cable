plugins { id 'net.minecraftforge.gradle' version '6.0.54' }

group = 'com.syaru.mecrosscable'
version = '0.1.0-alpha.1'
base { archivesName = 'me-cross-cable-forge-1.20.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
repositories {
    mavenCentral()
    maven { url = 'https://modmaven.dev' }
    if (project.hasProperty('ae2LocalDir')) flatDir { dirs file(property('ae2LocalDir')) }
}
sourceSets {
    assetGenerator {
        java.srcDirs = ['tools', 'src/main/java']
        java.include '**/GenerateAssets.java', '**/CableGeometry.java', '**/ChannelDisplay.java'
    }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            jvmArgs '-Xmx2G'
            mods { me_cross_cable { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}
dependencies {
    assetGeneratorImplementation 'com.google.code.gson:gson:2.10.1'
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'
    implementation fg.deobf(project.hasProperty('ae2LocalDir')
            ? 'local:appliedenergistics2-forge:15.4.11'
            : 'appeng:appliedenergistics2-forge:15.4.11')
    runtimeOnly fg.deobf('org.appliedenergistics:guideme:20.1.7')
}
tasks.register('generateAssets', JavaExec) {
    dependsOn tasks.named('assetGeneratorClasses')
    classpath = sourceSets.assetGenerator.runtimeClasspath
    mainClass = 'com.syaru.mecrosscable.tools.GenerateAssets'
    args layout.projectDirectory.dir('src/main/resources').asFile.absolutePath
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.named('jar') { finalizedBy 'reobfJar'; from('LICENSE', 'LICENSE-MIT', 'LICENSING.md') }
tasks.named('sourcesJar') { from 'tools' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
